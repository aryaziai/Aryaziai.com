<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Arya Ziai - Frontend Developer</title>
  <link rel="icon" href="https://aryaziai.com/images/favicon-96x96.png" type="image/gif">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html {
      cursor: url("./wheel-2.png") 48 48, auto;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffeaa7, #fdcb6e, #a29bfe, #74b9ff);
      background-size: 700% 700%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      animation: gradient 60s ease infinite
    }

    html::before {
      content: '';
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 999;
      animation: fadeOut .5s ease-out 5.5s forwards
    }

    html::after {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font: 3rem 'Courier New', monospace;
      color: #000;
      z-index: 1001;
      white-space: nowrap;
      pointer-events: none;
      border-right: 3px solid #000;
      padding-right: 3px;
      animation: type 2s steps(1, end) 1.3s forwards, blink .75s step-end 3.3s 5, fadeOut .5s ease-out 5.5s forwards
    }

    @keyframes type {
      0% {
        content: ''
      }

      8% {
        content: 'H'
      }

      16% {
        content: 'Hi'
      }

      25% {
        content: 'Hi,'
      }

      33% {
        content: 'Hi, '
      }

      41% {
        content: "Hi, I"
      }

      50% {
        content: "Hi, I'"
      }

      58% {
        content: "Hi, I'm"
      }

      66% {
        content: "Hi, I'm "
      }

      75% {
        content: "Hi, I'm A"
      }

      83% {
        content: "Hi, I'm Ar"
      }

      91% {
        content: "Hi, I'm Ary"
      }

      100% {
        content: "Hi, I'm Arya"
      }
    }

    @keyframes blink {

      from,
      to {
        border-color: transparent
      }

      50% {
        border-color: #000
      }
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden
      }
    }

    @keyframes gradient {

      0%,
      100% {
        background-position: 0% 50%
      }

      25% {
        background-position: 100% 50%
      }

      50% {
        background-position: 100% 100%
      }

      75% {
        background-position: 0% 100%
      }
    }

    body {
      width: 90%;
      max-width: 800px;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .15);
      display: flex;
      overflow: hidden;
      position: relative;
      min-height: 450px;
      perspective: 1000px;
      opacity: 0;
      animation: fadeIn .8s ease-out 5.7s forwards;
      transition: transform .3s ease, box-shadow .3s ease
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    body:hover {
      box-shadow: 0 25px 70px rgba(0, 0, 0, .2)
    }

    body::before {
      content: '';
      flex: 0 0 300px;
      border-radius: 5px 0 0 5px;
      background: url('https://aryaziai.com/images/pic01.jpg') center/cover;
      transition: all .6s cubic-bezier(.4, 0, .2, 1);
      transform-style: preserve-3d;
      color: #fff;
      font: 100 16px/1.8 inherit;
      white-space: pre-wrap;
      text-shadow: 2px 2px 2px rgba(0, 0, 0, .3)
    }

    body:hover::before {
      transform: rotateY(180deg) scaleX(-1);
      background: transparent;
      content: '✉️  arya721@gmail.com\A\A📱  415.786.7985\A\A🔗  linkedin.com/in/aryaziai\A\A📍  San Francisco, CA';
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box
    }

    body::after {
      content: 'About me \A\A I\'m a creative developer who enjoys pushing the boundaries of what\'s possible with web technologies since 2019. \A\A I believe in semantic HTML, clean code, and finding innovative solutions to interesting constraints. When I\'m not coding, you\'ll find me exploring new technologies, new bike paths 🚲 and sharing knowledge with the developer community. \A\A Let\'s connect and build something amazing together! \A\A 𝗙𝘂𝗻 𝗳𝗮𝗰𝘁: My portfolio is built entirely via CSS pseudo-elements, without div elements or javascript.\A\A - 𝒜𝓇𝓎𝒶 𝒵𝒾𝒶𝒾';
      flex: 1;
      padding: 50px 40px 40px;
      white-space: pre-wrap;
      line-height: 1.6;
      color: #333;
      font-size: 16px;
      background: #fff;
      border-radius: 0 10px 10px 0;
      transition: opacity .3s ease;
      overflow-y: auto;
      max-height: 450px
    }

    body:hover::after {
      content: '🛠️ Skills & Expertise\A\A⚛️ React / Next.js / TypeScript\A\A🎨 CSS3 / Tailwind / Animations\A\A📱 Responsive Design / Mobile-First\A\A🚀 Performance Optimization\A\A🔧 Node.js / Express / APIs\A\A📊 Data Visualization / D3.js\A\A🎯 Web Accessibility / SEO\A\A💡 Creative Problem Solving\A\A🤝 Team Collaboration / Mentoring'
    }

    @media (max-width:768px) {
      html {
        padding: 20px
      }

      html::before {
        font-size: 2rem
      }

      body {
        flex-direction: column;
        max-width: 400px;
        min-height: auto
      }

      body::before {
        flex: none;
        width: 100%;
        height: 300px;
        border-radius: 10px 10px 0 0
      }

      body:hover::before {
        font-size: 16px
      }

      body::after {
        padding: 30px;
        font-size: 15px;
        border-radius: 0 0 10px 10px
      }
    }
  </style>
</head>

<body></body>

</html>
