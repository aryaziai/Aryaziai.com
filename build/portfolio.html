<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Arya Ziai - Frontend Developer</title>
  <meta name="description"
    content="Creative frontend developer pushing the boundaries of web technologies. Specializing in semantic HTML, clean code, and innovative solutions.">
  <meta property="og:title" content="Arya Ziai - Frontend Developer">
  <meta property="og:description"
    content="Creative frontend developer pushing the boundaries of web technologies since 2019.">
  <meta property="og:image" content="https://aryaziai.com/images/pic01.jpg">
  <link rel="icon" href="https://aryaziai.com/images/favicon-96x96.png" type="image/png">
</head>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    color-scheme: only light;

    /* Colors */
    --dot-inactive: rgba(255, 255, 255, 0.3);
    --dot-active: rgba(255, 255, 255, 1);
    --shadow-light: rgba(0, 0, 0, .15);
    --shadow-dark: rgba(0, 0, 0, .2);

    /* Timing */
    --intro-duration: 0s;
    --type-delay: 1.3s;
    --type-duration: 2s;
    --blink-duration: 0.75s;
    --page-transition: 0.4s;

    /* Layout */
    --dot-size: 12px;
    --dot-spacing: 20px;
    --total-pages: 4;
    --border-radius: 10px;
  }

  /* Base Layout */
  html {
    cursor: none;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffeaa7, #fdcb6e, #a29bfe, #74b9ff);
    background-size: 700% 700%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    animation: gradient 65s ease infinite;
    width: 100vw;
    height: 100vh;
  }

  html:has([page]) {
    cursor: url("data:image/svg+xml,%3Csvg width='32' height='32' viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23808080' opacity='0.01'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23808080' stroke-width='1' opacity='0.5'/%3E%3C/svg%3E") 16 16, auto;
  }

  html:has([page="2"]) {
    animation-delay: 3s;
  }

  html:has([page="3"]) {
    animation-delay: 6s;
  }

  html:has([page="4"]) {
    animation-delay: 9s;
  }

  /* Intro Overlay */
  html::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 999;
    animation: fadeOut .5s ease-out var(--intro-duration) forwards;
  }

  /* Typing Animation */
  html::after {
    content: '';
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font: clamp(40px, 5vw, 999px) 'Courier New', monospace;
    color: black;
    z-index: 1001;
    white-space: normal;
    text-align: center;
    max-width: 90vw;
    pointer-events: none;
    border-right: 3px solid #000;
    padding-right: 3px;
    animation:
      type var(--type-duration) steps(1, end) var(--type-delay) forwards,
      blink var(--blink-duration) step-end calc(var(--type-delay) + var(--type-duration)) 5,
      fadeOut .5s ease-out var(--intro-duration) forwards;
  }

  /* Main Card Container with vertical page transition */
  body {
    cursor: default;
    border-radius: var(--border-radius);
    box-shadow: 0 20px 60px var(--shadow-light);
    display: flex;
    overflow: hidden;
    position: relative;
    perspective: 1000px;
    opacity: 0;
    animation: fadeIn .8s ease-out calc(var(--intro-duration) + 0.2s) forwards;
    transition: transform var(--page-transition) cubic-bezier(0.4, 0, 0.2, 1),
      box-shadow 0.3s ease;
    justify-content: center;
    height: 65vh;
  }

  body:hover {
    box-shadow: 0 25px 70px var(--shadow-dark);
  }

  /* Desktop vertical scroll effect */
  @media (min-width: 1100px) {

    body[page="1"],
    body[page="2"],
    body[page="3"],
    body[page="4"] {
      transform: translateY(0);
      opacity: 1;
    }

    /* Going down animations */
    body[data-direction="down"][page="2"],
    body[data-direction="down"][page="3"],
    body[data-direction="down"][page="4"] {
      animation: pageDown var(--page-transition) cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    /* Going up animations */
    body[data-direction="up"][page="1"],
    body[data-direction="up"][page="2"],
    body[data-direction="up"][page="3"] {
      animation: pageUp var(--page-transition) cubic-bezier(0.4, 0, 0.2, 1) both;
    }
  }

  /* Page transition animations */
  @keyframes pageDown {
    0% {
      transform: translateY(0);
      opacity: 1;
    }

    45% {
      transform: translateY(-100vh);
      opacity: 0;
    }

    55% {
      transform: translateY(100vh);
      opacity: 0;
    }

    100% {
      transform: translateY(0);
      opacity: 1;
    }
  }

  @keyframes pageUp {
    0% {
      transform: translateY(0);
      opacity: 1;
    }

    45% {
      transform: translateY(100vh);
      opacity: 0;
    }

    55% {
      transform: translateY(-100vh);
      opacity: 0;
    }

    100% {
      transform: translateY(0);
      opacity: 1;
    }
  }

  /* Left Panel - Image/Contact */
  body::before {
    content: '';
    flex: 0 0 300px;
    border-radius: 5px 0 0 5px;
    background: url('https://aryaziai.com/images/pic01.jpg') center/cover;
    transition: all 0.6s cubic-bezier(.4, 0, .2, 1);
    transform-style: preserve-3d;
    color: #fff;
    font: 100 16px/1.8 inherit;
    white-space: pre-wrap;
    text-shadow: 2px 2px 2px rgba(0, 0, 0, .3);
  }

  /* Right Panel - Content */
  body::after {
    --content-1: "About \A\A I\'m a creative developer who has been pushing the boundaries of what\'s possible with web technologies since 2019. \A\A I believe in semantic HTML, clean code, and finding innovative solutions to interesting constraints. When I\'m not coding, you\'ll find me exploring new technologies, discovering new bike paths 🚲, and sharing knowledge with the developer community.\A\A 𝗙𝘂𝗻 𝗳𝗮𝗰𝘁: My portfolio is built using CSS pseudo-elements, concise JavaScript, and zero <𝚍𝚒𝚟> elements";
    --content-2: "Hobbies \A\A I\'m a creative developer who has been pushing the boundaries of what\'s possible with web technologies since 2019. \A\A I believe in semantic HTML, clean code, and finding innovative solutions to interesting constraints. When I\'m not coding, you\'ll find me exploring new technologies, discovering new bike paths 🚲, and sharing knowledge with the developer community.\A\A 𝗙𝘂𝗻 𝗳𝗮𝗰𝘁: My portfolio is built using CSS pseudo-elements, minimal JavaScript, and zero <𝚍𝚒𝚟> elements";
    --content-3: "Interests \A\A I\'m a creative developer who has been pushing the boundaries of what\'s possible with web technologies since 2019. \A\A I believe in semantic HTML, clean code, and finding innovative solutions to interesting constraints. When I\'m not coding, you\'ll find me exploring new technologies, discovering new bike paths 🚲, and sharing knowledge with the developer community.\A\A 𝗙𝘂𝗻 𝗳𝗮𝗰𝘁: My portfolio is built using CSS pseudo-elements, minimal JavaScript, and zero <𝚍𝚒𝚟> elements";
    --content-4: "Contact \A\A I\'m a creative developer who has been pushing the boundaries of what\'s possible with web technologies since 2019. \A\A I believe in semantic HTML, clean code, and finding innovative solutions to interesting constraints. When I\'m not coding, you\'ll find me exploring new technologies, discovering new bike paths 🚲, and sharing knowledge with the developer community.\A\A 𝗙𝘂𝗻 𝗳𝗮𝗰𝘁: My portfolio is built using CSS pseudo-elements, minimal JavaScript, and zero <𝚍𝚒𝚟> elements";

    content: var(--content-1);
    flex: 1;
    padding: 50px 40px 40px;
    white-space: pre-wrap;
    line-height: 1.6;
    color: #333;
    font-size: 16px;
    background: #fff;
    border-radius: 0 var(--border-radius) var(--border-radius) 0;
    transition: opacity 0.3s ease;
    overflow-y: auto;
    width: 400px;
    max-width: fit-content;
  }

  body[page="2"]::before {
    background: url('./images/tri.jpg') center/cover;
  }

  body[page="2"]::after {
    content: var(--content-2);
  }

  body[page="3"]::after {
    content: var(--content-3);
  }

  body[page="4"]::after {
    content: var(--content-4);
  }

  /* Navigation Header */
  header {
    position: fixed;
    transform: translateY(-30px);
    pointer-events: none;
    width: 100vw;
    margin-left: 100px;
    align-self: center;
  }

  /* Navigation Dots Base */
  header::before,
  header::after {
    content: '';
    position: absolute;
    left: 0;
    width: var(--dot-size);
    height: var(--dot-size);
    border-radius: 50%;
    background: var(--dot-inactive);
    transition: background 0.3s ease;
    cursor: pointer;
    pointer-events: all;
  }

  /* Visible dots */
  header::before {
    top: 0;
    background: var(--dot-active);
    box-shadow:
      0 calc(var(--dot-spacing) * 1) 0 var(--dot-inactive),
      0 calc(var(--dot-spacing) * 2) 0 var(--dot-inactive),
      0 calc(var(--dot-spacing) * 3) 0 var(--dot-inactive);
  }

  /* Click area */
  header::after {
    display: block;
    background: transparent;
    width: calc(var(--dot-size) + 8px);
    height: calc(var(--dot-spacing) * var(--total-pages));
    top: calc(var(--dot-size) / -1.5);
    left: calc(var(--dot-size) / -2 - 4px);
    border-radius: 0;
    padding: calc(var(--dot-size) / 2);
    margin: 0 auto;
  }

  /* Active dot states */
  body[page="2"] header::before,
  body[page="3"] header::before,
  body[page="4"] header::before {
    background: var(--dot-inactive);
  }

  body[page="2"] header::before {
    box-shadow:
      0 var(--dot-spacing) 0 var(--dot-active),
      0 calc(var(--dot-spacing) * 2) 0 var(--dot-inactive),
      0 calc(var(--dot-spacing) * 3) 0 var(--dot-inactive);
  }

  body[page="3"] header::before {
    box-shadow:
      0 var(--dot-spacing) 0 var(--dot-inactive),
      0 calc(var(--dot-spacing) * 2) 0 var(--dot-active),
      0 calc(var(--dot-spacing) * 3) 0 var(--dot-inactive);
  }

  body[page="4"] header::before {
    box-shadow:
      0 var(--dot-spacing) 0 var(--dot-inactive),
      0 calc(var(--dot-spacing) * 2) 0 var(--dot-inactive),
      0 calc(var(--dot-spacing) * 3) 0 var(--dot-active);
  }

  /* Animations */
  @keyframes type {
    0% {
      content: ''
    }

    8% {
      content: 'H'
    }

    16% {
      content: 'Hi'
    }

    25% {
      content: 'Hi,'
    }

    33% {
      content: 'Hi, '
    }

    41% {
      content: "Hi, I"
    }

    50% {
      content: "Hi, I'"
    }

    58% {
      content: "Hi, I'm"
    }

    66% {
      content: "Hi, I'm "
    }

    75% {
      content: "Hi, I'm A"
    }

    83% {
      content: "Hi, I'm Ar"
    }

    91% {
      content: "Hi, I'm Ary"
    }

    100% {
      content: "Hi, I'm Arya"
    }
  }

  @keyframes blink {

    from,
    to {
      border-color: transparent
    }

    50% {
      border-color: #000
    }
  }

  @keyframes fadeOut {
    to {
      opacity: 0;
      visibility: hidden
    }
  }

  @keyframes fadeIn {
    to {
      opacity: 1;
      transform: translateY(0)
    }
  }

  @keyframes gradient {

    0%,
    100% {
      background-position: 0% 50%
    }

    25% {
      background-position: 100% 50%
    }

    50% {
      background-position: 100% 100%
    }

    75% {
      background-position: 0% 100%
    }
  }

  /* Desktop specific styles */
  @media (min-width: 1100px) {
    body {
      width: 55vw;
    }
  }

  /* Mobile Styles */
  @media (max-width: 1099px) {
    :root {
      --dot-inactive: rgba(203, 203, 203, 0.8);
      --dot-active: rgb(0, 154, 243);
      --mobile-image-height: 30vh;
    }

    html::before {
      font-size: 2rem;
    }

    body {
      flex-direction: column;
      height: 90vh;
      max-width: 90vw;
    }

    body::before {
      width: 100%;
      max-height: var(--mobile-image-height);
      border-radius: var(--border-radius) var(--border-radius) 0 0;
    }

    body::after {
      flex: 1 0 auto;
      padding: 30px;
      font-size: 15px;
      border-radius: 0 0 var(--border-radius) var(--border-radius);
      min-height: 0;
      height: 50vh;
    }

    header {
      transform: rotate(270deg);
      position: absolute;
      width: 0;
      margin: 0;
      inset: calc(var(--mobile-image-height) + 4vh) auto auto 43%;
    }
  }
</style>

<body>
  <header></header>
  <script src="./script.js"></script>
</body>
<!--Look Ma, No Divs!-->

</html>
