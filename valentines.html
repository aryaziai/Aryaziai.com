<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>💕 Valentine's Day 2025 💕</title>


  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♥️</text></svg>">

  <!-- Social Media Meta Tags -->
  <meta property="og:title" content="Valentines, AZ+LS">
  <meta property="og:description"
    content="Join Darrell's epic birthday celebration with healthy, delicious juices! Discover amazing health benefits and vibrant flavors.">
  <meta property="og:image"
    content="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 630' style='background: linear-gradient(135deg, %23013220, %23025d35)'><text x='50%' y='40%' text-anchor='middle' font-size='200' dominant-baseline='middle'>🥤</text><text x='50%' y='65%' text-anchor='middle' font-size='60' fill='%23ffcc00' font-family='Arial, sans-serif' dominant-baseline='middle'>Darrell's Juice Bar</text><text x='50%' y='80%' text-anchor='middle' font-size='40' fill='%23e0ffe0' font-family='Arial, sans-serif' dominant-baseline='middle'>Happy Birthday! 🎉</text></svg>">
  <meta property="og:url" content="https://darrells-juice-bar.example.com">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Valentines - AZ+LS">
  <meta name="twitter:description" content="Will you be my Valentine?">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
      font-family: 'Georgia', serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 40px;
      position: relative;
      z-index: 10;
    }

    .question {
      font-size: 3rem;
      color: #d63384;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      opacity: 0;
      transform: scale(0.5);
      animation: fadeInScale 1.5s ease-out forwards;
      animation-delay: 0.5s;
    }

    @keyframes fadeInScale {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .buttons {
      margin-top: 40px;
      display: flex;
      gap: 30px;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 1s ease-out forwards;
      animation-delay: 2s;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    .btn {
      padding: 15px 50px;
      font-size: 1.5rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .btn-yes {
      background: linear-gradient(45deg, #ff6b6b, #ee5a5a);
      color: white;
      box-shadow: 0 4px 15px rgba(238, 90, 90, 0.4);
    }

    .btn-yes:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(238, 90, 90, 0.6);
    }

    .btn-no {
      background: linear-gradient(45deg, #a8a8a8, #888888);
      color: white;
      box-shadow: 0 4px 15px rgba(136, 136, 136, 0.4);
    }

    .btn-no:hover {
      transform: scale(0.9);
    }

    .response {
      display: none;
      font-size: 2.5rem;
      margin-top: 30px;
      animation: bounceIn 0.6s ease-out;
    }

    @keyframes bounceIn {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      50% {
        transform: scale(1.2);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .response-no {
      color: #666;
    }

    .response-yes {
      color: #d63384;
    }

    .emoji {
      font-size: 5rem;
      display: block;
      margin-bottom: 20px;
    }

    /* Floating hearts background */
    .heart {
      position: fixed;
      font-size: 1.5rem;
      color: rgba(255, 255, 255, 0.6);
      animation: float 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      50% {
        transform: translateY(-20px) rotate(10deg);
        opacity: 0.7;
      }
    }

    .celebration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ff6b6b;
      animation: confettiFall 3s ease-out forwards;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(-100vh) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

    .hidden {
      display: none !important;
    }

    .big-heart {
      font-size: 6rem;
      animation: heartBeat 1s ease-in-out infinite;
    }

    @keyframes heartBeat {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }
    }

    .slideshow-container {
      margin-top: 30px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .slideshow-container img {
      max-width: 100%;
      max-height: 400px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      animation: fadeInImg 1s ease-in-out;
    }

    @keyframes fadeInImg {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="main-content">
      <img src="images/liv/bobby.png">
      <br><br>
      <h1 class="question">Will you be my Valentine? 💕</h1>
      <div class="buttons">
        <button class="btn btn-yes" onclick="sayYes()">Yes! 💖</button>
        <button class="btn btn-no" onclick="sayNo()">No 😢</button>
      </div>
    </div>

    <div id="response-yes" class="response response-yes">
      <span class="emoji big-heart">💖</span>
      <div class="slideshow-container">
        <img id="slideshow-img" src="images/liv/1.jpg" alt="Photo slideshow">
      </div>
      <br>
      <p>I love you! 🥰💕</p>
    </div>

    <div id="response-no" class="response response-no">
      <span class="emoji" id="no-emoji">😞</span>
      <p>wehhh</p>
    </div>
  </div>

  <div class="celebration" id="celebration"></div>

  <!-- Audio element for yes response -->
  <audio id="yesAudio" preload="auto" loop>
    <source src="audio/valentines.mp3" type="audio/mpeg">
  </audio>

  <!-- Audio element for no response -->
  <audio id="noAudio" preload="auto" loop>
    <source src="audio/weh.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Create floating hearts background
    function createFloatingHearts() {
      const hearts = ['💕', '💖', '💗', '💓', '💝', '❤️'];
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.top = Math.random() * 100 + 'vh';
        heart.style.animationDelay = Math.random() * 4 + 's';
        heart.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
        document.body.appendChild(heart);
      }
    }

    // Create confetti celebration
    function createConfetti() {
      const celebration = document.getElementById('celebration');
      const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6b9d', '#c9b1ff'];

      for (let i = 0; i < 100; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDelay = Math.random() * 2 + 's';
        confetti.style.width = (Math.random() * 10 + 5) + 'px';
        confetti.style.height = (Math.random() * 10 + 5) + 'px';
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        celebration.appendChild(confetti);
      }
    }

    let slideshowInterval = null;
    let currentSlide = 1;
    const totalSlides = 15;

    function startSlideshow() {
      slideshowInterval = setInterval(() => {
        currentSlide++;
        if (currentSlide > totalSlides) {
          currentSlide = 1;
        }
        const img = document.getElementById('slideshow-img');
        img.style.animation = 'none';
        img.offsetHeight; // Trigger reflow
        img.src = 'images/liv/' + currentSlide + '.jpg';
        img.style.animation = 'fadeInImg 1s ease-in-out';
      }, 10000);
    }

    function sayYes() {
      document.getElementById('main-content').classList.add('hidden');
      document.getElementById('response-yes').style.display = 'block';
      createConfetti();
      startSlideshow();

      // Play audio
      const audio = document.getElementById('yesAudio');
      audio.play().catch(e => {
        console.log('Audio play failed:', e);
        // Audio might fail if file doesn't exist or autoplay is blocked
      });
    }

    function sayNo() {
      document.getElementById('main-content').classList.add('hidden');
      document.getElementById('response-no').style.display = 'block';

      // Play audio
      const audio = document.getElementById('noAudio');
      audio.play().catch(e => {
        console.log('Audio play failed:', e);
      });

      // Go back to main page after 5 seconds
      setTimeout(() => {
        audio.pause();
        audio.currentTime = 0;
        document.getElementById('response-no').style.display = 'none';
        document.getElementById('main-content').classList.remove('hidden');
      }, 5000);
    }

    // Initialize floating hearts on page load
    window.onload = createFloatingHearts;
  </script>
</body>

</html>
